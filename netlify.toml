[build]
  command = "npm run build"
  publish = "dist"

# Existing files under /maps/ are served as-is; this only catches missing SPA routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
